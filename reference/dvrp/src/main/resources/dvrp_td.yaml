name: "DVRP_Problem_Config"
version: "1.0"

PROBLEM_TYPE: "DYNAMIC_VEHICLE_ROUTING_PROBLEM"
OBJECTIVE_FUNCTION: "MINIMIZE_TOTAL_DISTANCE"

RESOURCE_PATH: "DVRP_Instance/"
INSTANCE_FILE_NAME: "r101_1.xlsx"
INSTANCE_BASE_NAME: "r101_1"
DEGREE_OF_DYNAMISM: 25
EFFECTIVE_DEGREE_OF_DYNAMISM: 25

NUM_CUSTOMERS: 25
VEHICLE_CAPACITY: 200
INITIAL_VEHICLE_COUNT: 25
SPEED: 1.0
DISTANCE_SCALE: 1.0
# Current benchmark convention: floor arc distance cost and travel time to one decimal place.
# Set the rounding modes to ROUND if you want the earlier rounded-distance DVRP convention.
DISTANCE_DECIMAL_PLACES: 1
TRAVEL_TIME_DECIMAL_PLACES: 1
DISTANCE_ROUNDING_MODE: "FLOOR"
TRAVEL_TIME_ROUNDING_MODE: "FLOOR"
